name: Tests

on:
    push:
        paths:
            - "**.py"
            - "adapters/**"
            - "tests/**"
            - ".github/workflows/test.yml"
    pull_request:
        paths:
            - "**.py"
            - "adapters/**"
            - "tests/**"
            - ".github/workflows/test.yml"

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "stable"

            - name: Run tests
              run: python tests/run_tests.py
